worker_processes  1;

events {
    worker_connections  1024;
    use epoll;
}

pid /tmp/nginx.pid;

http {
    include conf.d/*.conf;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp_path;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # minimize proxy buffers for testing disk buffering
    proxy_buffering on;
    proxy_buffer_size 1k;
    proxy_buffers 2 1k;
    proxy_busy_buffers_size 1k;
    proxy_max_temp_file_size 1024m;
    proxy_temp_file_write_size 1k;

    # minimize uwsgi buffers for testing disk buffering
    uwsgi_buffering on;
    uwsgi_buffer_size 1k;
    uwsgi_buffers 2 1k;
    uwsgi_busy_buffers_size 1k;
    uwsgi_max_temp_file_size 1024m;
    uwsgi_temp_file_write_size 1k;

    server {
        listen       8080;
        server_name  localhost;

        location / {
            default_type text/plain;
            return 200 'This is a proxy!';
        }

        location /test-proxy {
            proxy_pass http://127.0.0.1:5000;
        }

        location /test-uwsgi {
            uwsgi_pass 127.0.0.1:5001;
            include uwsgi_params;
        }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   /srv/www/htdocs/;
        }
    }

    include vhosts.d/*.conf;
}
